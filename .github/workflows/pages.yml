name: deploy-pages

on:
  push:
    branches: ['claude/**']
    paths: ['site/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages can only be enabled by the repo owner (Settings > Pages >
      # Source: GitHub Actions). Until then configure-pages 403s; the site
      # is served from Vercel anyway, so skip the deploy instead of failing
      # the PR check. (Job-level continue-on-error still reds the check run.)
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - if: steps.pages.outcome != 'success'
        run: echo "Pages is not enabled for this repo; skipping deploy (site is live on Vercel)."
